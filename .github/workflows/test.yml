name: test

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        
      - uses: fast-actions/setup-dotnet@v1
        with:
          sdk-version: '10.x'
          
      - name: Build
        run: dotnet build
          
      - name: Run debug tests
        run: dotnet test -c Debug
        
      - name: Run release tests
        run: dotnet test -c Release
